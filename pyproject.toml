[project]
name = "robot-demo"
version = "0.1.0"
description = "Mô phỏng xe robot 2 bánh trong MuJoCo kèm cầu nối điều khiển cho Antigravity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.26",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
